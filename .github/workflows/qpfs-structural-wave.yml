name: QPFS Structural Candidate Wave

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/qpfs/materialize-structural-wave.mjs'
      - 'knowledge/qpfs/structural-harvest/manifests/unified-structural-intake-manifest-v0.1.yaml'
      - 'knowledge/qpfs/structural-harvest/reconciliation/QSIM-000003.yaml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reconciled data plane and generate structural proposals
        run: node scripts/qpfs/materialize-structural-wave.mjs
      - name: Verify immutable safety gates
        run: |
          node -e "const r=require('./knowledge/qpfs/structural-harvest/runtime/wave-2-execution-report.json'); if(r.lexical_rows!==169||r.unique_ids!==169||r.unique_row_keys!==169||r.canonical_parable_decisions_created||r.qpu_created) process.exit(1)"
      - name: Commit generated runtime artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/qpfs/structural-harvest/runtime/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(qpfs): materialize wave two structural candidates'
          git push
