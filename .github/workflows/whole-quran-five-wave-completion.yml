name: Whole Quran Five Wave Completion
on:
  push:
    branches: [whole-quran-parallel-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whole-quran-global-reconciliation
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-quran-parallel-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ingest canonical Uthmani Quran corpus
        run: |
          mkdir -p data/quran
          curl --fail --silent --show-error --retry 3 'https://api.quran.com/api/v4/quran/verses/uthmani' -o /tmp/quran.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const j=JSON.parse(fs.readFileSync('/tmp/quran.json'));const verses=j.verses;
          if(!Array.isArray(verses)||verses.length!==6236)throw Error('denominator failure');
          const rows=verses.map(v=>{const [surah,ayah]=v.verse_key.split(':').map(Number);return {surah,ayah,text:v.text_uthmani}});
          if(new Set(rows.map(x=>x.surah)).size!==114||new Set(rows.map(x=>`${x.surah}:${x.ayah}`)).size!==6236||rows.some(x=>!x.text))throw Error('canonical corpus integrity failure');
          const body=rows.map(JSON.stringify).join('\n')+'\n';fs.writeFileSync('data/quran/canonical-quran.jsonl',body);fs.writeFileSync('data/quran/canonical-quran-provenance.json',JSON.stringify({source:'Quran.com API v4',endpoint:'https://api.quran.com/api/v4/quran/verses/uthmani',script:'Uthmani',verse_rows:6236,surahs:114,sha256:crypto.createHash('sha256').update(body).digest('hex'),retrieved_at:new Date().toISOString()},null,2)+'\n');
          NODE
      - name: Execute W1-W5 foundation pipeline
        run: |
          node scripts/qfm-v2/whole-quran-five-wave-engine.mjs
          node scripts/qfm-v2/whole-quran-wave2-candidate-harvest.mjs
          node scripts/qfm-v2/whole-quran-waves3-5.mjs
      - name: Execute final S1-S5 research closure stages
        run: node scripts/qfm-v2/final-five-stage-engine.mjs
      - name: Verify S1 hold compression
        run: node -e "const x=require('./data/qfm-v2/whole-quran/12-s1-hold-compression-v1.0.json');if(x.status!=='PASS'||x.orphan_holds||x.duplicated_review_work)process.exit(1)"
      - name: Verify S2 court integrity
        run: node -e "const x=require('./data/qfm-v2/whole-quran/13-s2-parallel-scholarly-court-v1.0.json');if(x.silent_decisions||x.unsupported_merges||x.unsupported_splits)process.exit(1)"
      - name: Verify S3 identity safety
        run: node -e "const x=require('./data/qfm-v2/whole-quran/14-s3-global-identity-solver-v1.0.json');if(!x.event_journey_witness_preserved||x.cross_lane_unknown_collisions)process.exit(1)"
      - name: Verify S4 registry integrity
        run: node -e "const x=require('./data/qfm-v2/whole-quran/15-s4-serial-truth-promotion-v1.0.json');if(x.nar_gaps||x.nar_duplicates||x.premature_allocations)process.exit(1)"
      - name: Verify S5 zero-proof truth state
        run: node -e "const x=require('./data/qfm-v2/whole-quran/16-s5-adversarial-zero-proof-v1.0.json');if(x.zero_proof_matrix.unscanned||x.zero_proof_matrix.unclassified||x.zero_proof_matrix.unaccounted||x.zero_proof_matrix.silent_unresolved)process.exit(1)"
      - name: Persist generated evidence
        if: github.event_name == 'push'
        run: |
          git config user.name qce-production-bot
          git config user.email qce-production-bot@users.noreply.github.com
          git add data/quran/ data/qfm-v2/whole-quran/
          git diff --cached --quiet && exit 0
          git commit -m 'build(qfm-v2): materialize final S1-S5 evidence [skip ci]'
          git pull --rebase origin whole-quran-parallel-completion
          git push origin HEAD:whole-quran-parallel-completion
