name: Whole Quran Five Wave Completion
on:
  push:
    branches: [whole-quran-parallel-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whole-quran-global-reconciliation-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'whole-quran-parallel-completion' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write execution sentinel
        run: node scripts/qfm-v2/execution-sentinel-and-materialization.mjs
      - name: Ingest canonical Uthmani Quran corpus
        run: |
          mkdir -p data/quran
          curl --fail --silent --show-error --retry 3 'https://api.quran.com/api/v4/quran/verses/uthmani' -o /tmp/quran.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const j=JSON.parse(fs.readFileSync('/tmp/quran.json'));const verses=j.verses;
          if(!Array.isArray(verses)||verses.length!==6236)throw Error('denominator failure');
          const rows=verses.map(v=>{const [surah,ayah]=v.verse_key.split(':').map(Number);return {surah,ayah,text:v.text_uthmani}});
          if(new Set(rows.map(x=>x.surah)).size!==114||new Set(rows.map(x=>`${x.surah}:${x.ayah}`)).size!==6236||rows.some(x=>!x.text))throw Error('canonical corpus integrity failure');
          const body=rows.map(JSON.stringify).join('\n')+'\n';fs.writeFileSync('data/quran/canonical-quran.jsonl',body);fs.writeFileSync('data/quran/canonical-quran-provenance.json',JSON.stringify({source:'Quran.com API v4',endpoint:'https://api.quran.com/api/v4/quran/verses/uthmani',script:'Uthmani',verse_rows:6236,surahs:114,sha256:crypto.createHash('sha256').update(body).digest('hex'),retrieved_at:new Date().toISOString()},null,2)+'\n');
          NODE
      - name: Execute foundation and adjudication pipeline
        run: |
          node scripts/qfm-v2/whole-quran-five-wave-engine.mjs
          node scripts/qfm-v2/whole-quran-wave2-candidate-harvest.mjs
          node scripts/qfm-v2/whole-quran-waves3-5.mjs
          node scripts/qfm-v2/final-five-stage-engine.mjs
          node scripts/qfm-v2/scholarly-case-refinery.mjs
          node scripts/qfm-v2/scholarly-dossier-engine.mjs
          node scripts/qfm-v2/evidence-adjudication-engine.mjs
          node scripts/qfm-v2/adjudication-and-closure-controller.mjs
          node scripts/qfm-v2/packet-disposition-parent-court.mjs
      - name: Enforce materialization contract
        run: node scripts/qfm-v2/execution-sentinel-and-materialization.mjs --verify
      - name: Verify safety invariants and parent-case recovery
        run: |
          node -e "const x=require('./data/qfm-v2/whole-quran/17-scholarly-case-refinery-v1.0.json');if(x.status!=='PASS'||x.orphan_refs||x.duplicate_refs||x.max_packet_verses>12)process.exit(1)"
          node -e "const x=require('./data/qfm-v2/whole-quran/19-scholarly-decisions-v1.0.json');if(x.unsupported_identity_inferences!==0||x.auto_safe_decisions+x.scholarly_holds!==x.input_dossiers)process.exit(1)"
          node -e "const x=require('./data/qfm-v2/whole-quran/20-adjudication-state-v1.0.json');if(x.silent_unresolved||x.resolved+x.explicit_holds!==x.dossiers)process.exit(1)"
          node -e "const x=require('./data/qfm-v2/whole-quran/21-promotion-controller-v1.0.json');if(x.new_allocations!==0||x.next_available!=='NAR-000057')process.exit(1)"
          node -e "const fs=require('fs');const p='./data/qfm-v2/whole-quran/24-packet-disposition-parent-court-v1.0.json';if(!fs.existsSync(p))process.exit(1);const x=require(p);if(x.orphan_refs||x.duplicate_refs)process.exit(1)"
      - name: Persist branch-head evidence
        run: |
          git config user.name qce-production-bot
          git config user.email qce-production-bot@users.noreply.github.com
          git add data/quran/ data/qfm-v2/whole-quran/
          git diff --cached --quiet && exit 0
          git commit -m 'build(qfm-v2): materialize evidence chain 16-24 [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin whole-quran-parallel-completion && git push origin HEAD:whole-quran-parallel-completion && exit 0
            sleep $((attempt*3))
          done
          exit 1
      - name: Report fail-closed research state
        run: |
          node - <<'NODE'
          const x=require('./data/qfm-v2/whole-quran/22-zero-proof-closure-controller-v1.0.json');
          console.log(JSON.stringify({status:x.status,audit:x.independent_adversarial_audit,research:x.whole_quran_narrative_research,identity_holds:x.zero_proof_matrix.explicit_scholarly_identity_holds,remaining_work:x.remaining_work}));
          NODE
      - name: Enforce final certificate only when zero is reached
        if: github.event_name == 'workflow_dispatch'
        run: node -e "const x=require('./data/qfm-v2/whole-quran/22-zero-proof-closure-controller-v1.0.json');if(x.status!=='PASS'||x.independent_adversarial_audit!=='PASS'||x.whole_quran_narrative_research!=='COMPLETE'||x.zero_proof_matrix.explicit_scholarly_identity_holds!==0||x.remaining_work!==0)process.exit(1)"
