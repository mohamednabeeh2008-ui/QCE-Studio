name: Whole Quran Five Wave Completion
on:
  push:
    branches: [whole-quran-parallel-completion]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whole-quran-global-reconciliation
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-quran-parallel-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute five-wave fail-closed engine
        run: node scripts/qfm-v2/whole-quran-five-wave-engine.mjs
      - name: Verify no premature completion
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/qfm-v2/whole-quran/01-wave-1-census-gate-v1.0.json';
          if(!fs.existsSync(p)) process.exit(1);
          const x=require('./'+p);
          if(x.status!=='PASS' && x.allocation_frozen!==true) process.exit(1);
          console.log(x);
          NODE
      - name: Persist generated evidence when successful
        if: success()
        run: |
          git config user.name qce-production-bot
          git config user.email qce-production-bot@users.noreply.github.com
          git add data/qfm-v2/whole-quran/
          git diff --cached --quiet && exit 0
          git commit -m 'build(qfm-v2): materialize whole-Quran five-wave evidence [skip ci]'
          git pull --rebase origin whole-quran-parallel-completion
          git push origin HEAD:whole-quran-parallel-completion
