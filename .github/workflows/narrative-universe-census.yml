name: Narrative Universe Census

on:
  push:
    paths:
      - 'scripts/qfm-v2/audit-narrative-universe-coverage.mjs'
      - 'data/qfm-v2/**'
      - 'knowledge/**'
      - '.github/workflows/narrative-universe-census.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute full source census
        run: node scripts/qfm-v2/audit-narrative-universe-coverage.mjs
      - name: Verify generated artifacts
        run: |
          test -s data/qfm-v2/audits/generated/narrative-universe-source-census-v0.1.json
          test -s data/qfm-v2/audits/generated/nar-evidence-reconciliation-v0.1.json
          node -e "const x=require('./data/qfm-v2/audits/generated/narrative-universe-source-census-v0.1.json'); if(!x.safety.pass) process.exit(1); if(x.safety.nar_000039_allocated) process.exit(1); console.log(x.recovered_counts); console.log(x.nar_reconciliation_summary)"
          node -e "const r=require('./data/qfm-v2/audits/generated/nar-evidence-reconciliation-v0.1.json'); if(r.records.length!==38) process.exit(1); if(r.records.some(x=>!x.nar_id||!x.status||!Array.isArray(x.sources))) process.exit(1); console.log(r.counts)"
      - name: Persist verified recovery evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "qce-recovery-bot"
          git config user.email "qce-recovery-bot@users.noreply.github.com"
          git add -f data/qfm-v2/audits/generated/narrative-universe-source-census-v0.1.json
          git add -f data/qfm-v2/audits/generated/nar-evidence-reconciliation-v0.1.json
          if git diff --cached --quiet; then
            echo "No recovery evidence changes to persist"
          else
            git commit -m "chore(recovery): persist verified census evidence [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: narrative-universe-recovery-v0.1
          path: |
            data/qfm-v2/audits/generated/narrative-universe-source-census-v0.1.json
            data/qfm-v2/audits/generated/nar-evidence-reconciliation-v0.1.json