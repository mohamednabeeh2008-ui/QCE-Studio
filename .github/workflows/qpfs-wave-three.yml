name: QPFS Wave Three

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qpfs-wave-three.yml'
      - 'scripts/qpfs/execute-wave-three.mjs'
      - 'scripts/qpfs/freeze-quran-context-authority.mjs'
      - 'scripts/qpfs/hydrate-wave-three-context.mjs'
      - 'knowledge/qpfs/structural-harvest/runtime/wave-2-execution-report-v2.json'
      - 'knowledge/qpfs/structural-harvest/runtime/structural-candidate-proposals-v2.json'
      - 'knowledge/qpfs/wave-3/**'

concurrency:
  group: qpfs-wave-three-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-wave-three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Freeze and verify Quran context authority
        run: |
          node scripts/qpfs/freeze-quran-context-authority.mjs
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const dir='knowledge/qpfs/wave-3/authorities/qta-000001';
          const m=JSON.parse(fs.readFileSync(`${dir}/snapshot-manifest-v1.json`,'utf8'));
          const b=fs.readFileSync(`${dir}/quran-uthmani.txt`);
          const h=crypto.createHash('sha256').update(b).digest('hex');
          if(m.status!=='FROZEN_PASS'||m.ayah_count!==6236||m.surah_count!==114||m.unique_locators!==6236) throw new Error('Authority structural gate failed');
          if(h!==m.sha256) throw new Error('Authority checksum gate failed');
          console.log('PASS: QTA-000001 independently verified');
          NODE
      - name: Execute guarded Wave 3 entry
        run: node scripts/qpfs/execute-wave-three.mjs
      - name: Hydrate 69-candidate context queue
        run: node scripts/qpfs/hydrate-wave-three-context.mjs
      - name: Verify Wave 3 authority queue and hydration gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='knowledge/qpfs/wave-3/runtime/wave-3-execution-report-v1.json';
          const q='knowledge/qpfs/wave-3/runtime/root-aware-investigation-queue-v1.json';
          const h='knowledge/qpfs/wave-3/runtime/context-hydration-report-v1.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const queue=JSON.parse(fs.readFileSync(q,'utf8'));
          const hydration=JSON.parse(fs.readFileSync(h,'utf8'));
          if(r.entry_gate!=='PASS') throw new Error('Entry gate not PASS');
          if(r.root_aware_queue_count!==69 || r.unique_candidate_ids!==69) throw new Error('Queue reconciliation failed');
          if(queue.count!==69 || queue.records.length!==69) throw new Error('Queue materialization failed');
          if(new Set(queue.records.map(x=>x.candidate_id)).size!==69) throw new Error('Queue identity uniqueness failed');
          if(r.canonical_parable_decisions_created!==false || r.qpu_created!==false) throw new Error('Premature canonical output detected');
          if(hydration.queue_count!==69 || hydration.hydrated_count!==69 || hydration.unresolved_locator_count!==0) throw new Error('Context hydration gate failed');
          if(hydration.status!=='CLOSED_PASS') throw new Error('Context hydration did not close');
          console.log('PASS: Wave 3 authority, queue, and hydration gates verified');
          NODE
      - name: Commit Wave 3 material evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/qpfs/wave-3/authorities/qta-000001/ knowledge/qpfs/wave-3/runtime/
          if git diff --cached --quiet; then
            echo 'No material changes to commit'
          else
            git commit -m 'data(qpfs): freeze authority and hydrate wave three queue'
            git push
          fi
